<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comics Recsys{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-repisa: #8b5e34;
      --sombra-repisa: rgba(0, 0, 0, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root { --color-repisa: #5c3d22; --sombra-repisa: rgba(0, 0, 0, 0.6); }
    }
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    nav a, nav button { margin-left: 0.75rem; }

    /* "Repisa": el borde inferior grueso + sombra simulan los comics parados
       sobre un estante de biblioteca -- align-items: flex-end hace que todas
       las tapas apoyen en la misma línea. El título de cada card tiene una
       altura RESERVADA fija (line-clamp a 2 líneas + min-height) para que un
       nombre largo no cambie la altura total de la card -- si no, con
       flex-end, una card con título de 2 líneas "empuja" su tapa hacia arriba
       respecto de las cards vecinas con título de 1 línea, y quedan
       desalineadas. El gap vertical, además, queda más grande que el
       horizontal para separar bien una fila de la siguiente. */
    .estante { margin-bottom: 2.5rem; }
    .estante .grid {
      align-items: flex-end;
      row-gap: 2rem;
      column-gap: 0.9rem;
      padding: 0 0.5rem 16px;
      border-bottom: 14px solid var(--color-repisa);
      border-radius: 3px;
      box-shadow: 0 10px 12px -8px var(--sombra-repisa);
    }

    .grid { display: flex; flex-wrap: wrap; row-gap: 1.5rem; column-gap: 1rem; }
    .card { width: 140px; }
    /* aspect-ratio + object-fit: las tapas son casi todas 200x308 (1,54), pero
       hay algunas más anchas -- así todas ocupan la misma caja en la repisa,
       y la card ya tiene su alto antes de que la imagen externa termine de
       cargar (sin saltos de layout). */
    .card img { width: 100%; aspect-ratio: 200 / 308; object-fit: cover; display: block; border-radius: 3px 3px 1px 1px; box-shadow: 2px 3px 6px var(--sombra-repisa); }
    .card .titulo {
      font-size: 0.85rem; font-weight: bold; margin: 0.35rem 0 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; min-height: 2.3em;
    }
    .card .detalle { font-size: 0.75rem; opacity: 0.75; margin: 0; }
    .card .acciones { display: flex; gap: 0.3rem; margin-top: 0.35rem; }
    .card .acciones form { display: flex; gap: 0.25rem; flex: 1; }
    .card .acciones input[type="number"] { width: 2.6rem; font-size: 0.75rem; padding: 0.1rem 0.2rem; }
    .card .acciones button { font-size: 0.72rem; padding: 0.15rem 0.35rem; cursor: pointer; }
    .flash { background: #fff3cd; color: #664d03; padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    form.linea { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; }
    form.linea label { display: flex; flex-direction: column; font-size: 0.8rem; }

    .controles { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .controles a { opacity: 0.7; text-decoration: none; }
    .controles a.activo { opacity: 1; font-weight: bold; text-decoration: underline; }
    .controles form { display: flex; align-items: center; gap: 0.35rem; margin-left: 0.5rem; }
    .paginacion { display: flex; gap: 1rem; align-items: center; justify-content: center; margin-top: 0.75rem; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav>
  <strong>Comics Recsys</strong>
  <div>
    {% if current_user.is_authenticated %}
      <span>Hola, {{ current_user.nombre }}</span>
      <form action="{{ url_for('auth.logout') }}" method="post" style="display:inline">
        <button type="submit">Salir</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Entrar</a>
      <a href="{{ url_for('auth.registro') }}">Registrarme</a>
    {% endif %}
  </div>
</nav>

{% for mensaje in get_flashed_messages() %}
  <p class="flash">{{ mensaje }}</p>
{% endfor %}

{% block content %}{% endblock %}

</body>
</html>
