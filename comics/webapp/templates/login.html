{% extends "base.html" %}
{% block title %}Entrar - Comics Recsys{% endblock %}
{% block content %}
<h1>Entrar</h1>
<form class="linea" method="post">
  <label>Usuario o nombre
    <input type="text" name="identificador" required autofocus>
  </label>
  <label>Contraseña
    <input type="password" name="password" required>
  </label>
  <button type="submit">Entrar</button>
</form>
<p>¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Registrate</a>.</p>
{% endblock %}
