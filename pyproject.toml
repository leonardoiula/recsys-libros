[project]
name = "recsys-libros"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leonardo.iula", email = "leonardoiula@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "implicit>=0.7.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

[project.scripts]
recsys-libros = "recsys_libros:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "optuna>=4.9.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
